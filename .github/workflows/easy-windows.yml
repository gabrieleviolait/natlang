name: NatLang Studio Easy — Windows packages

on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - 'dist/**'
      - 'scripts/start_gguf.ps1'
      - '.github/workflows/easy-windows.yml'
      - 'CMakeLists.txt'
      - 'README.md'
  workflow_dispatch:
    inputs:
      include_model:
        description: 'Bundle Qwen3 GGUF as well (Full offline AI package)'
        type: boolean
        default: false
      publish_release:
        description: 'Publish downloadable assets in GitHub Releases'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: natlang-studio-package-${{ github.ref }}-${{ inputs.include_model || false }}
  cancel-in-progress: false

env:
  NATLANG_VERSION: '0.5.1'
  LLVM_MINGW_VERSION: '20260922'
  LLAMA_CPP_TAG: 'b11404'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build natc and Windows Studio
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          foreach ($name in @('natc.exe','natlang-studio.exe')) {
            if (!(Test-Path "build/Release/$name")) { throw "Missing $name" }
          }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Smoke test with MSVC
        shell: pwsh
        run: |
          & .\build\Release\natc.exe examples\hello.nat --check
          if ($LASTEXITCODE -ne 0) { throw 'natc parse smoke failed' }
          & .\build\Release\natc.exe examples\hello.nat -o "$env:RUNNER_TEMP\hello-msvc.exe" --compiler cl --opt-level 0
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "$env:RUNNER_TEMP\hello-msvc.exe")) { throw 'MSVC native compilation failed' }
          & "$env:RUNNER_TEMP\hello-msvc.exe"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC program execution failed' }
      - name: Stage app, documentation, and licenses
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/payload,dist/payload/scripts,dist/payload/ai/bin,dist/payload/ai/models,dist/payload/ai/licenses | Out-Null
          Copy-Item build/Release/natc.exe,build/Release/natlang-studio.exe dist/payload/
          Copy-Item -Recurse docs,examples,LICENSE,CHANGELOG.md dist/payload/
          Copy-Item scripts/start_gguf.ps1 dist/payload/scripts/
          Copy-Item dist/EASY_START.md dist/payload/docs/EASY_START.md
      - name: Include portable llvm-mingw toolchain
        shell: pwsh
        run: |
          $tag = $env:LLVM_MINGW_VERSION
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$tag/llvm-mingw-$tag-ucrt-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\llvm-mingw.zip" -MaximumRedirection 5
          Expand-Archive "$env:RUNNER_TEMP\llvm-mingw.zip" -DestinationPath "$env:RUNNER_TEMP\llvm-mingw" -Force
          $clang = Get-ChildItem "$env:RUNNER_TEMP\llvm-mingw" -Filter clang++.exe -Recurse | Select-Object -First 1
          if (!$clang) { throw 'llvm-mingw archive lacks clang++.exe' }
          $toolchainRoot = Split-Path $clang.DirectoryName -Parent
          Copy-Item $toolchainRoot dist/payload/toolchain -Recurse
          if (!(Test-Path dist/payload/toolchain/bin/clang++.exe)) { throw 'Portable compiler not staged' }
          "llvm-mingw $tag (UCRT x64)" | Set-Content dist/payload/toolchain/VERSION-natlang.txt
      - name: Verify portable compilation WITHOUT Visual Studio
        shell: pwsh
        run: |
          # Only the bundled toolchain may be used, not the preinstalled MSVC or runner PATH.
          $env:PATH = "$(Resolve-Path 'dist/payload/toolchain/bin');$env:PATH"
          & .\dist\payload\toolchain\bin\clang++.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Portable clang++ cannot start' }
          & .\dist\payload\natc.exe examples\hello.nat -o "$env:RUNNER_TEMP\hello-portable.exe" --compiler clang++ --opt-level 0
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "$env:RUNNER_TEMP\hello-portable.exe")) { throw 'Portable compilation failed' }
          & "$env:RUNNER_TEMP\hello-portable.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Portable executable failed' }
      - name: Include llama.cpp CPU runtime (pinned release)
        shell: pwsh
        run: |
          $tag = $env:LLAMA_CPP_TAG
          $api = "https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/$tag"
          $r = Invoke-RestMethod $api -Headers @{ 'User-Agent'='NatLang-studio-packager' }
          $asset = $r.assets | Where-Object { $_.name -match '^llama-.*-bin-win-cpu-x64\.zip$' } | Select-Object -First 1
          if (!$asset) { throw "Cannot locate official llama.cpp CPU asset for $tag" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\llama-cpu.zip" -MaximumRedirection 5
          Expand-Archive "$env:RUNNER_TEMP\llama-cpu.zip" -DestinationPath "$env:RUNNER_TEMP\llama-cpu" -Force
          $server = Get-ChildItem "$env:RUNNER_TEMP\llama-cpu" -Filter llama-server.exe -Recurse | Select-Object -First 1
          if (!$server) { throw 'llama-server.exe missing in upstream ZIP' }
          Copy-Item "$($server.DirectoryName)\*" dist/payload/ai/bin/ -Recurse -Force
          if (!(Test-Path dist/payload/ai/bin/llama-server.exe)) { throw 'llama-server.exe missing from bundle' }
          "llama.cpp $tag / $($asset.name)" | Set-Content dist/payload/ai/runtime-version.txt
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/ggml-org/llama.cpp/b11404/LICENSE' -OutFile dist/payload/ai/licenses/llama.cpp-LICENSE-MIT.txt
      - name: Include Qwen3 model for Full offline edition (manual choice)
        if: ${{ inputs.include_model == true }}
        shell: pwsh
        run: |
          $dest = 'dist/payload/ai/models/Qwen3-0.6B-Q4_K_M.gguf'
          $url = 'https://huggingface.co/tensorblock/Qwen_Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf?download=true'
          Invoke-WebRequest -Uri $url -OutFile $dest -MaximumRedirection 8
          $file = Get-Item $dest
          $stream = [IO.File]::OpenRead($file.FullName)
          try { $magic = [byte[]]::new(4); $n = $stream.Read($magic,0,4) } finally { $stream.Dispose() }
          if ($n -ne 4 -or $file.Length -lt 300000000 -or [Text.Encoding]::ASCII.GetString($magic) -ne 'GGUF') { throw 'GGUF invalid or truncated' }
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/apache/httpd/trunk/LICENSE' -OutFile dist/payload/ai/licenses/Apache-2.0-model-LICENSE.txt
      - name: Create installer, ZIP and SHA256 checksums
        shell: pwsh
        run: |
          $edition = if ('${{ inputs.include_model }}' -eq 'true') { 'Full' } else { 'Easy' }
          $zip = "dist/NatLang-Studio-$edition-Windows-x64.zip"
          Compress-Archive -Path 'dist/payload/*' -DestinationPath $zip -CompressionLevel Optimal
          choco install innosetup --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'ISCC.exe missing' }
          & $iscc dist/NatLang.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer creation failed' }
          $setup = "dist/out/NatLang-Studio-$edition-Setup.exe"
          if ($edition -eq 'Full') { Move-Item 'dist/out/NatLang-Studio-Easy-Setup.exe' $setup -Force }
          foreach ($path in @($zip,$setup)) {
            if (!(Test-Path $path) -or (Get-Item $path).Length -lt 1000000) { throw "Missing/invalid package $path" }
          }
          $checksums = @($zip,$setup) | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant(),(Split-Path $_ -Leaf)
          }
          $hashFile = "dist/NatLang-Studio-$edition-SHA256SUMS.txt"
          $checksums | Set-Content -Path $hashFile -Encoding ascii
          "NATLANG_EDITION=$edition" >> $env:GITHUB_ENV
          "NATLANG_ZIP=$zip" >> $env:GITHUB_ENV
          "NATLANG_SETUP=$setup" >> $env:GITHUB_ENV
          "NATLANG_HASH=$hashFile" >> $env:GITHUB_ENV
      - name: Upload tested Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NatLang-Studio-${{ env.NATLANG_EDITION }}-Windows-x64
          path: |
            ${{ env.NATLANG_ZIP }}
            ${{ env.NATLANG_SETUP }}
            ${{ env.NATLANG_HASH }}
          if-no-files-found: error
          retention-days: 90
      - name: Publish public GitHub Release assets
        if: ${{ github.event_name == 'push' || inputs.publish_release == true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:NATLANG_VERSION"
          gh release view $tag --json tagName > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "NatLang Studio Easy $tag" --notes "Windows x64 preview. Installer and portable ZIP include NatLang Studio, natc, LLVM-MinGW and llama.cpp. GGUF is downloaded on first AI use in Easy, or bundled only in Full. Windows SmartScreen may show a warning for unsigned binaries. See dist/EASY_START.md and docs/THIRD_PARTY.md."
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag "$env:NATLANG_ZIP" "$env:NATLANG_SETUP" "$env:NATLANG_HASH" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          Write-Host "Release published: $tag / $env:NATLANG_EDITION"
