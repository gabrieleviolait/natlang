name: C++ build and integration tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Ubuntu / GCC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build build --parallel
      - name: Integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Compiler smoke test
        run: |
          ./build/natc examples/countdown.nat -o countdown --compiler g++
          test "$(./countdown)" = "$(printf '5\n4\n3\n2\n1\nDone!')"

  windows:
    name: Windows / MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Initialize Developer Command Prompt environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Integration tests
        shell: pwsh
        run: |
          $env:NATC = Join-Path $pwd 'build/Release/natc.exe'
          python -m unittest discover -s tests -v
